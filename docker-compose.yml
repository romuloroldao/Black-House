# PostgreSQL só para desenvolvimento local (senha fraca — não use em produção)
services:
  postgres:
    image: postgres:16-alpine
    container_name: blackhouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: blackhouse_local_2026
      POSTGRES_DB: blackhouse_db
    ports:
      - "5432:5432"
    volumes:
      - blackhouse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d blackhouse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  blackhouse_pgdata:
