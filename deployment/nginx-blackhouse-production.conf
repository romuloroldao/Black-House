# Configuração Nginx produção — blackhouse.app.br
# Acesso global: identifica região via Cloudflare, NUNCA bloqueia tráfego internacional.
# Incluir no http {}: include /etc/nginx/snippets/cloudflare-real-ip.conf;

map $http_cf_ipcountry $client_region {
    default $http_cf_ipcountry;
    ""      "XX";
}

# Frontend - blackhouse.app.br e www.blackhouse.app.br
server {
    server_name blackhouse.app.br www.blackhouse.app.br;

    root /var/www/blackhouse/dist;
    index index.html;

    access_log /var/log/nginx/blackhouse-access.log;
    error_log /var/log/nginx/blackhouse-error.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1000;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Access-Scope "global" always;
    add_header X-Client-Region $client_region always;

    server_tokens off;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Access-Scope "global" always;
        add_header X-Client-Region $client_region always;
    }

    # Vite: assets/nome-HASH.js|css
    location ~* "^/assets/.+-[a-zA-Z0-9]+\.(js|css|mjs)$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        add_header X-Access-Scope "global" always;
        add_header X-Client-Region $client_region always;
        access_log off;
    }

    location ~* \.(js|css|mjs)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Vary "Accept-Encoding" always;
        add_header X-Access-Scope "global" always;
        add_header X-Client-Region $client_region always;
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        add_header X-Access-Scope "global" always;
        add_header X-Client-Region $client_region always;
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/blackhouse.app.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/blackhouse.app.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# API - api.blackhouse.app.br
server {
    server_name api.blackhouse.app.br;

    access_log /var/log/nginx/blackhouse-api-access.log;
    error_log /var/log/nginx/blackhouse-api-error.log warn;

    client_max_body_size 50M;
    client_body_timeout 90s;
    client_header_timeout 90s;

    proxy_connect_timeout 15s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    add_header X-Access-Scope "global" always;
    add_header X-Client-Region $client_region always;

    server_tokens off;

    # Uploads (fotos de check-in no telemóvel — podem demorar 10–15s cada)
    location ~ ^/api/uploads/(progress-photo|educational-pdf) {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header X-Client-Region $client_region;

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
        client_body_timeout 120s;
    }

    location /auth {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header X-Client-Region $client_region;

        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header X-Client-Region $client_region;

        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /health {
        proxy_pass http://localhost:3001/health;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        access_log /var/log/nginx/blackhouse-api-health.log;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/blackhouse.app.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/blackhouse.app.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.blackhouse.app.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = blackhouse.app.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name blackhouse.app.br www.blackhouse.app.br;
    return 404; # managed by Certbot
}

server {
    if ($host = api.blackhouse.app.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.blackhouse.app.br;
    return 404; # managed by Certbot
}
