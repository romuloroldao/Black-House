# Configuração Nginx para blackhouse.app.br
# Acesso global — identifica região via Cloudflare, NUNCA bloqueia tráfego internacional.
# Incluir no http {}: include /etc/nginx/snippets/cloudflare-real-ip.conf;

map $http_cf_ipcountry $client_region {
    default $http_cf_ipcountry;
    ""      "XX";
}

map $http_cf_ipcountry $is_international_access {
    default 1;
    "BR"    0;
    "XX"    0;
    ""      0;
}

# Frontend - blackhouse.app.br e www.blackhouse.app.br
server {
    listen 80;
    listen [::]:80;
    server_name blackhouse.app.br www.blackhouse.app.br;

    root /var/www/blackhouse/dist;
    index index.html;

    access_log /var/log/nginx/blackhouse-access.log;
    error_log /var/log/nginx/blackhouse-error.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1000;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Access-Scope "global" always;
    add_header X-Client-Region $client_region always;

    server_tokens off;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Access-Scope "global" always;
        add_header X-Client-Region $client_region always;
    }

    # Assets com hash (Vite: nome-HASH.js|css) — cache longo para CDN internacional
    location ~* "^/assets/.+-[a-zA-Z0-9]+\.(js|css|mjs)$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        add_header X-Access-Scope "global" always;
        add_header X-Client-Region $client_region always;
        access_log off;
    }

    # JS/CSS sem hash — revalidar (transição de deploy)
    location ~* \.(js|css|mjs)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Vary "Accept-Encoding" always;
        add_header X-Access-Scope "global" always;
        add_header X-Client-Region $client_region always;
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        add_header X-Access-Scope "global" always;
        add_header X-Client-Region $client_region always;
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# API - api.blackhouse.app.br
server {
    listen 80;
    listen [::]:80;
    server_name api.blackhouse.app.br;

    access_log /var/log/nginx/blackhouse-api-access.log;
    error_log /var/log/nginx/blackhouse-api-error.log;

    client_max_body_size 50M;
    client_body_timeout 90s;
    client_header_timeout 90s;

    # Timeouts estendidos para latência internacional
    proxy_connect_timeout 15s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    add_header X-Access-Scope "global" always;
    add_header X-Client-Region $client_region always;

    server_tokens off;

    location /auth {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header X-Client-Region $client_region;

        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header X-Client-Region $client_region;

        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /health {
        proxy_pass http://localhost:3001/health;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        access_log /var/log/nginx/blackhouse-api-health.log;
    }
}
