# Guarda de regressão: falha se Supabase/PostgREST voltarem ao código.
# O nome do workflow aparece nos e-mails do GitHub — NÃO significa que o app usa Supabase.
name: Guard no-Supabase

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run validate:no-supabase
        run: |
          chmod +x scripts/validate-no-supabase.sh
          npm run validate:no-supabase
