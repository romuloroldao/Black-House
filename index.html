    <!-- Tipo de aparelho (mesma regra de src/lib/device.ts): marca <html data-device> antes do primeiro paint -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var ipad = /Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1;
          var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
          var device = ipad ? 'tablet' : !coarse ? 'desktop' : Math.min(screen.width, screen.height) <= 767 ? 'phone' : 'tablet';
          d.setAttribute('data-device', device);
          var standalone = (window.matchMedia && (window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches)) || navigator.standalone === true;
          if (standalone && device !== 'desktop') d.setAttribute('data-standalone', '');
        } catch (e) {}
      })();
    </script>
    
    <!-- REACT-PWA-SOFT-LOCK-FIX-004: Meta tags para prevenir cache do index.html -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Tema: default dark; evita flash claro antes do React (storageKey bh-theme) -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('bh-theme');
          var theme = stored || 'dark';
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- REACT-PWA-SOFT-LOCK-FIX-004: Desregistrar Service Workers antigos que podem bloquear novos deploys -->
    <!-- O service worker atual do app (/sw.js) e os caches dele (workbox-precache*, bh-static-*) são preservados. -->
    <script>
      // REACT-PWA-SOFT-LOCK-FIX-004: Executar ANTES de qualquer outro script
      // Service Workers antigos podem interceptar requests e servir assets inválidos
      (function() {
        function isCurrentAppWorker(registration) {
          var sw = registration.active || registration.waiting || registration.installing;
          return !!sw && new URL(sw.scriptURL).pathname === '/sw.js';
        }
        function isCurrentAppCache(name) {
          return name.indexOf('workbox-precache') === 0 || name.indexOf('bh-static-') === 0;
        }
        // REACT-PWA-SOFT-LOCK-FIX-004: Desregistrar Service Workers antigos (qualquer um que não seja /sw.js)
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(all) {
            var registrations = all.filter(function(r) { return !isCurrentAppWorker(r); });
            if (registrations.length > 0) {
              console.warn('[REACT-PWA-SOFT-LOCK-FIX-004] Encontrados', registrations.length, 'Service Worker(s) antigo(s). Desregistrando...');
              for (let registration of registrations) {
                console.warn('[REACT-PWA-SOFT-LOCK-FIX-004] Desregistrando Service Worker:', registration.scope);
                registration.unregister().then(function(success) {
                  if (success) {
                    console.log('[REACT-PWA-SOFT-LOCK-FIX-004] Service Worker desregistrado:', registration.scope);
                  } else {
                    console.error('[REACT-PWA-SOFT-LOCK-FIX-004] Falha ao desregistrar Service Worker:', registration.scope);
                  }
                }).catch(function(error) {
                  console.error('[REACT-PWA-SOFT-LOCK-FIX-004] Erro ao desregistrar Service Worker:', error);
                });
              }
            } else {
              console.log('[REACT-PWA-SOFT-LOCK-FIX-004] Nenhum Service Worker encontrado');
            }
          }).catch(function(error) {
            console.error('[REACT-PWA-SOFT-LOCK-FIX-004] Erro ao verificar Service Workers:', error);
          });
        }
        
        // REACT-PWA-SOFT-LOCK-FIX-004: Limpar TODOS os caches antigos que podem conter assets inválidos
        if ('caches' in window) {
          caches.keys().then(function(allNames) {
            var cacheNames = allNames.filter(function(n) { return !isCurrentAppCache(n); });
            if (cacheNames.length > 0) {
              console.warn('[REACT-PWA-SOFT-LOCK-FIX-004] Encontrados', cacheNames.length, 'cache(s) antigo(s). Limpando...');
              return Promise.all(
                cacheNames.map(function(cacheName) {
                  console.warn('[REACT-PWA-SOFT-LOCK-FIX-004] Limpando cache:', cacheName);
                  return caches.delete(cacheName);
                })
              );
            } else {
              console.log('[REACT-PWA-SOFT-LOCK-FIX-004] Nenhum cache encontrado');
              return Promise.resolve([]);
            }
          }).then(function() {
            console.log('[REACT-PWA-SOFT-LOCK-FIX-004] Caches antigos limpos com sucesso');
          }).catch(function(error) {
            console.error('[REACT-PWA-SOFT-LOCK-FIX-004] Erro ao limpar caches:', error);
          });
        }
      })();
    </script>
    
    <!-- DESIGN-CHECKPOINT-FAILSAFE-CLIENT-DELIVERY-001: Script para esconder Fail-Safe quando React montar -->
    <script>
      // DESIGN-CHECKPOINT-FAILSAFE-CLIENT-DELIVERY-001: Esconder Fail-Safe UI quando React montar com sucesso
      // Este script é executado antes do React e monitora quando o React monta
      (function() {
        var failsafeUI = document.getElementById('failsafe-ui');
        var root = document.getElementById('root');
        
        // Função para esconder Fail-Safe UI
        function hideFailsafeUI() {
          if (failsafeUI) {
            failsafeUI.classList.add('hidden');
            // DESIGN-CHECKPOINT-FAILSAFE-CLIENT-DELIVERY-001: Marcar como React montado
            window.__REACT_MOUNTED__ = true;
          }
        }
        
        // DESIGN-CHECKPOINT-FAILSAFE-CLIENT-DELIVERY-001: Monitorar quando React monta
        // Verificar se root tem conteúdo (React montou)
        var observer = new MutationObserver(function(mutations) {
          if (root && root.children.length > 0) {
            // React montou - esconder Fail-Safe após pequeno delay para transição suave
            setTimeout(hideFailsafeUI, 300);
            observer.disconnect();
          }
        });
        
        // Observar mudanças no root
        if (root) {
          observer.observe(root, { childList: true, subtree: true });
        }
        
        // DESIGN-CHECKPOINT-FAILSAFE-CLIENT-DELIVERY-001: Timeout de segurança
        // Se React não montar em 10 segundos, manter Fail-Safe visível mas mostrar mensagem
        setTimeout(function() {
          if (!window.__REACT_MOUNTED__ && failsafeUI) {
            var message = failsafeUI.querySelector('p');
            if (message) {
              message.textContent = 'O sistema está operando em modo seguro. Algumas funcionalidades podem estar limitadas. Por favor, recarregue a página ou entre em contato com o suporte.';
            }
          }
        }, 10000);
      })();
    </script>
